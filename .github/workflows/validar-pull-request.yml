name: Validar Painel Regional

on:
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Validar processador SharePoint
        run: node --check scripts/processar-sharepoint.mjs

      - name: Validar TypeScript e build
        run: npm run build
