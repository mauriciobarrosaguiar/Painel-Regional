name: Deploy Painel Regional no Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Validar build
        run: npm run build

      - name: Criar ou localizar banco D1
        shell: bash
        run: |
          set -euo pipefail

          API_URL="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database"

          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "${API_URL}?name=painel-regional-db" \
            > /tmp/d1-list.json

          DB_ID=$(node <<'NODE'
          const fs = require('fs')
          const data = JSON.parse(fs.readFileSync('/tmp/d1-list.json', 'utf8'))
          if (!data.success) {
            console.error(JSON.stringify(data.errors || data))
            process.exit(1)
          }
          const rows = Array.isArray(data.result) ? data.result : []
          const row = rows.find((item) => item.name === 'painel-regional-db')
          process.stdout.write(row?.uuid || '')
          NODE
          )

          if [ -z "$DB_ID" ]; then
            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"name":"painel-regional-db"}' \
              "${API_URL}" \
              > /tmp/d1-create.json

            DB_ID=$(node <<'NODE'
          const fs = require('fs')
          const data = JSON.parse(fs.readFileSync('/tmp/d1-create.json', 'utf8'))
          if (!data.success) {
            console.error(JSON.stringify(data.errors || data))
            process.exit(1)
          }
          process.stdout.write(data.result?.uuid || '')
          NODE
            )
          fi

          if [ -z "$DB_ID" ] || [ "$DB_ID" = "00000000-0000-0000-0000-000000000000" ]; then
            echo "Não foi possível obter o ID real do banco D1."
            exit 1
          fi

          node - "$DB_ID" <<'NODE'
          const fs = require('fs')
          const databaseId = process.argv[2]
          const path = 'wrangler.jsonc'
          const config = JSON.parse(fs.readFileSync(path, 'utf8'))
          config.d1_databases = config.d1_databases || []
          const current = config.d1_databases.find((item) => item.binding === 'DB')
          if (current) {
            current.database_name = 'painel-regional-db'
            current.database_id = databaseId
          } else {
            config.d1_databases.push({
              binding: 'DB',
              database_name: 'painel-regional-db',
              database_id: databaseId,
            })
          }
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`)
          NODE

          echo "Banco D1 configurado com sucesso."

      - name: Aplicar estrutura do banco D1
        run: npx wrangler d1 migrations apply DB --remote

      - name: Criar projeto Pages quando necessário
        run: npx wrangler pages project create painel-regional --production-branch main || true

      - name: Configurar proteção das credenciais
        shell: bash
        run: |
          set -euo pipefail
          APP_SECRET=$(printf '%s' "${CLOUDFLARE_API_TOKEN}:${CLOUDFLARE_ACCOUNT_ID}:painel-regional:v1" | sha256sum | cut -d' ' -f1)
          printf '%s' "$APP_SECRET" | npx wrangler pages secret put PAINEL_REGIONAL_KEY --project-name painel-regional

      - name: Publicar Painel Regional
        run: npx wrangler pages deploy dist --project-name painel-regional --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=true
