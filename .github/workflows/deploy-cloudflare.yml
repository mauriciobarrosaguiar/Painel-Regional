name: Deploy Painel Regional no Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm install

      - name: Validar build
        run: npm run build

      - name: Criar projeto Pages quando necessário
        run: npx wrangler pages project create painel-regional --production-branch main || true

      - name: Publicar primeira versão e provisionar bindings
        run: npx wrangler pages deploy dist --project-name painel-regional --branch main --commit-hash $GITHUB_SHA --experimental-auto-create

      - name: Aplicar estrutura do banco D1
        run: npx wrangler d1 migrations apply painel-regional-db --remote

      - name: Republicar com banco atualizado
        run: npx wrangler pages deploy dist --project-name painel-regional --branch main --commit-hash $GITHUB_SHA --experimental-auto-create
